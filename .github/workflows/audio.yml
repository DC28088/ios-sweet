name: sweet-audio
# CoreAudio HAL plug-in (userspace/audio, from HackiOS): Speaker/Hawking/Actuator/Codec devices.
# The Actuator's samples go to /dev/sweet-haptic (xnu/patches/0160, sweethaptic=3).
on:
  workflow_dispatch:
  push:
    branches: [codex/adreno-power-audit]
    paths: [userspace/audio/**, .github/workflows/audio.yml]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign SweetAudio.driver for iOS 16 arm64
        run: |
          out=userspace/out/sweet-audio-ios16/SweetAudio.driver
          mkdir -p "$out"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -O2 -Wall -Wextra -Wno-unused-parameter \
            -bundle -framework CoreFoundation -o "$out/SweetAudio" userspace/audio/sweet_audio_plugin.c
          cp userspace/audio/Info.plist "$out/Info.plist"
          plutil -lint "$out/Info.plist"
          codesign --force --sign - --pagesize 4096 "$out/SweetAudio"
          codesign --verify --strict "$out/SweetAudio"
          (cd "$out" && shasum -a 256 SweetAudio Info.plist > ../SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: sweet-audio-ios16
          path: userspace/out/sweet-audio-ios16/
