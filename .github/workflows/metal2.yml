name: sweet-metal2
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          brew install llvm glslang bison flex ninja
          echo "$(brew --prefix llvm)/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          python3 --version
      - name: Host test: PM4 builder
        run: |
          clang++ -std=c++17 -Wall -Wextra -I userspace/native/src \
            userspace/native/test/pm4_test.cpp -o "$RUNNER_TEMP/sweet-pm4-test"
          "$RUNNER_TEMP/sweet-pm4-test"
      - name: Build iOS 16 SweetMetal2 bundle
        run: python3 tools/build-sweet-metal2.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sweet-metal2-ios16
          path: |
            userspace/out/SweetMetal2.bundle
            userspace/out/metal2-build.json
            userspace/out/NativeAdrenoABI.h
      - name: Save build diagnostics
        if: failure()
        run: |
          mkdir -p userspace/diagnostics
          find research/sweet-metal2-build -maxdepth 3 -name '*.log' -type f -exec cp {} userspace/diagnostics/ \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweet-metal2-diagnostics
          path: userspace/diagnostics/
