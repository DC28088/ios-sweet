name: xnu26

# iOS 26 track, step 1: an xnu-12377.121.6 (macOS/iOS 26.5) SWEET kernel built from the
# Bergamota fork's xnu/patches-12377 series at a pinned commit (fetched here, not vendored).
# That series carries our patches 0001-0080 ported to 12377 plus their iOS 26 userland fixes;
# their Poco F1 drivers only run when the ADT says "xiaomi,beryllium". Our own 0081-0248 are
# not in this kernel yet. See NOTES.md (2026-11-13 iOS 26 entries).

on:
  workflow_dispatch:
    inputs:
      bergamota_sha:
        description: ry-diffusion/Bergamota commit whose xnu/patches-12377 to build
        default: 37a7a7a917fc09945ed2f7d1ae68b84d4525b4cb
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      use_kdk:
        description: download KDK 26.5 (headers only; TrustCache/API.h is KDK-only)
        type: boolean
        default: true
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      runner:
        description: runner label (macos-26 arm64 had no capacity on 2026-11-13; macos-15-intel built 0248)
        default: macos-15-intel

concurrency:
  group: xnu26-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  BERGAMOTA_REPO: https://github.com/ry-diffusion/Bergamota
  BERGAMOTA_SHA: ${{ inputs.bergamota_sha || '37a7a7a917fc09945ed2f7d1ae68b84d4525b4cb' }}
  MACOS_VERSION: "26.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: SWEET

jobs:
  build:
    # 26.x sources need Xcode 26.x (Bergamota/dxb use macos-26 + Xcode 26.1)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and patch series
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          git init -q berg
          git -C berg fetch -q --depth 1 "$BERGAMOTA_REPO" "$BERGAMOTA_SHA"
          git -C berg checkout -q FETCH_HEAD
          test "$(git -C berg rev-parse HEAD)" = "$BERGAMOTA_SHA"
          # dxb applies patches/26.0/*.sh, then *.patch in name order: its own first, ours ("sweet-") after
          n=0
          for f in berg/xnu/patches-12377/*.patch berg/xnu/patches-12377/*.sh; do
            [ -e "$f" ] || continue
            cp "$f" "dxb/patches/26.0/sweet-$(basename "$f")"; n=$((n+1))
          done
          echo "copied $n files"
          # our own 12377 patches (sweet hardware), applied after Bergamota's series (2000+ sorts after 1130)
          for f in xnu/patches-12377/*.patch; do
            [ -e "$f" ] || continue
            cp "$f" "dxb/patches/26.0/sweet-$(basename "$f")"; echo "ours: $(basename "$f")"
          done
          (cd berg/xnu/patches-12377 && shasum -a 256 *; cd "$GITHUB_WORKSPACE/xnu/patches-12377" 2>/dev/null && shasum -a 256 *.patch) > series-SHA256SUMS
          if [ "${{ inputs.use_kdk }}" = "false" ]; then
            # 0027-stage-coreentitlements-v2-stub.sh stands in for dxb's KDK header copy
            rm dxb/patches/26.0/00_setup_coreentitlements.sh
            mkdir -p "$RUNNER_TEMP/no-kdk"
            echo "KDKROOT=$RUNNER_TEMP/no-kdk" >> "$GITHUB_ENV"
          fi
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          # dxb only warns when a patch does not apply; for ours that must fail the build
          python3 - <<'PY'
          p = 'dxb/build.sh'
          s = open(p).read()
          needle = '                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"\n'
          assert needle in s, 'build.sh patches() layout changed; update the fatal-patch hook'
          s = s.replace(needle, needle + '                case "$(basename "${PATCH}")" in sweet-*) error "our patch does not apply: ${PATCH}"; exit 1 ;; esac\n')
          open(p, 'w').write(s)
          PY
          ls dxb/patches/26.0 | head -20

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26.1*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | head -1)
          [ -n "$XC" ] || { echo "no Xcode 26.x on this runner"; exit 1; }
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set +e
          bash build.sh > build.log 2>&1
          rc=$?
          grep -aE "error:|our patch does not apply|Applying patch|Skipping patch|Running script" build.log | grep -v warning | head -400
          tail -40 build.log
          exit $rc

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp series-SHA256SUMS out/ || true
          grep -aoE "[A-Za-z0-9_./+-]+\.(c|cpp|h|s|exports)(:[0-9]+){1,2}: (fatal )?error: .*" dxb/build.log \
            | sed 's|.*/dxb/||' | sort | uniq -c | sort -rn > out/errors.txt || true
          gzip -c dxb/build.log > out/build.log.gz || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          CONFIG=$(printf '%s' "$KERNEL_CONFIG" | tr '[:upper:]' '[:lower:]')
          K="out/kernel.$CONFIG.sweet"
          if [ -f "$K" ]; then file "$K"; strings -a "$K" | grep -m3 -E "Darwin Kernel Version|xnu-12377" || true; fi
          # our patches must be in the binary
          for p in xnu/patches-12377/*.patch; do [ -e "$p" ] || continue; echo "check $(basename "$p")"; done
          if ls xnu/patches-12377/2000-*.patch >/dev/null 2>&1; then
            grep -aFq 'SWEET CPUFREQ: not an SM7150 sweet board' "$K" && grep -aFq 'SWEET CPUFREQ: domain %u selected lut' "$K" \
              && echo "2000 cpufreq strings present" || { echo "2000 cpufreq strings MISSING"; exit 1; }
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu26-kernel
          path: out/
          if-no-files-found: warn
