name: sweet-gles
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          brew install bison flex ninja pkg-config
          echo "$(brew --prefix bison)/bin:$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          python3 -m venv research/gles-venv
          research/gles-venv/bin/python -m pip install 'meson==1.10.2' 'Mako==1.3.10' 'PyYAML==6.0.3' 'packaging==25.0' 'ply==3.11'
          echo "$GITHUB_WORKSPACE/research/gles-venv/bin" >> "$GITHUB_PATH"
      - name: Compile Mesa freedreno and iOS16 EAGL integration
        run: research/gles-venv/bin/python tools/build-sweet-gles.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sweet-gles-ios16
          path: userspace/out/sweet-gles-ios16/
      - name: Save diagnostics
        if: failure()
        run: |
          mkdir -p userspace/diagnostics/gles
          find research/sweet-gles-build -name '*.log' -type f -exec cp {} userspace/diagnostics/gles/ \; || true
          cp -R research/sweet-gles-build/frontend/out userspace/diagnostics/gles/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweet-gles-diagnostics
          path: userspace/diagnostics/gles/
