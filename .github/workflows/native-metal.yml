name: sweet-native-metal
on:
  workflow_dispatch:
  push:
    branches: [codex/native-adreno-metal]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install native compiler build tools
        run: |
          brew install bison flex ninja
          echo "$(brew --prefix bison)/bin:$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build direct AIR and freedreno Metal bundle
        run: python3 tools/build-sweet-native-metal.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sweet-native-metal-ios16
          path: |
            userspace/out/SweetNativeMetal.bundle
            userspace/out/native-metal-build.json
            userspace/out/native-metal-dependencies.txt
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p userspace/diagnostics/native-metal
          find research/sweet-native-metal-build -name '*.log' -type f -exec cp {} userspace/diagnostics/native-metal/ \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweet-native-metal-diagnostics
          path: userspace/diagnostics/native-metal/
