name: UniXNU AArch64 menu

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools clang-18 llvm-18 lld-18 python3-setuptools
      - name: Fetch pinned UniXNU and Mu base
        run: |
          git init -q upstream-unixnu
          git -C upstream-unixnu fetch --depth 1 https://github.com/UniXNU/UniXNU.git 89801d6e9265ba9aa49e56de642565288d679f83
          git -C upstream-unixnu checkout --detach FETCH_HEAD
          git init -q mu-basecore
          git -C mu-basecore fetch --depth 1 https://github.com/microsoft/mu_basecore.git cfb93724a06ff86ff5ba971413368a7809ee42a5
          git -C mu-basecore checkout --detach FETCH_HEAD
          git -C mu-basecore submodule update --init --depth 1 -- MdePkg/Library/BaseFdtLib/libfdt MdePkg/Library/MipiSysTLib/mipisyst BaseTools/Source/C/BrotliCompress/brotli
      - name: Compile generic menu applications
        env:
          CLANG_BIN: /usr/lib/llvm-18/bin/
          JOBS: 4
        run: |
          export UNIXNU_EDK2="$GITHUB_WORKSPACE/mu-basecore"
          export UNIXNU_BUILD_DIR="$GITHUB_WORKSPACE/menu-build"
          bash upstream-unixnu/package/build.sh -b DEBUG -t CLANGPDB
          mkdir -p out
          cp menu-build/Build/Out/AARCH64-DEBUG/UniXNU.efi out/
          cp menu-build/Build/Out/AARCH64-DEBUG/UniXNUDxe.efi out/
          cp ports/UniXNU-sweet/sources.json out/source-inputs.json
          printf '%s\n' 'Generic AArch64 UEFI menu only. Not a sweet boot.img or an iOS16 kernel. No hardware tests executed.' > out/README.txt
          (cd out && sha256sum *.efi > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-menu-aarch64
          path: out/
          if-no-files-found: warn

  sweet_firmware:
    needs: menu
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unixnu-menu-aarch64
          path: menu-inputs
      - name: Install legacy firmware dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev nasm acpica-tools gcc-aarch64-linux-gnu clang llvm lld mono-devel nuget python3-venv python3-distutils gettext
      - name: Fetch exact sweet firmware source
        run: |
          git init -q uefi-sweet
          git -C uefi-sweet fetch --depth 1 https://github.com/tagicmi/Mu-Silicium-marble-davinci.git 098e303fd9703669ab06d38744cad14d49c0f702
          git -C uefi-sweet checkout --detach FETCH_HEAD
          git -C uefi-sweet submodule update --init --depth 1 -- Binaries Common/Mu Common/Mu_OEM_Sample Common/Mu_Tiano_Plus Features/DFCI Mu_Basecore Silicon/Arm/Mu_Tiano Silicium-ACPI
          python3 -m venv .venv
          .venv/bin/pip install setuptools==80.9.0
          .venv/bin/pip install -r uefi-sweet/pip-requirements.txt
      - name: Integrate menu and compile sweet UEFI
        run: |
          (cd menu-inputs && sha256sum -c SHA256SUMS)
          python3 ports/uefi-sweet/inject-unixnu.py uefi-sweet menu-inputs
          source .venv/bin/activate
          export CLANGPDB_AARCH64_PREFIX=aarch64-linux-gnu-
          cd uefi-sweet
          bash build_uefi.sh -d sweet -r DEBUG
          test -s Mu-sweet.img
          test "$(stat -c %s Build/sweetPkg/DEBUG_CLANGPDB/FV/SWEET_UEFI.fd)" = 3145728
          mkdir -p ../firmware-out
          cp Mu-sweet.img ../firmware-out/
          cp Build/sweetPkg/DEBUG_CLANGPDB/FV/SWEET_UEFI.fd ../firmware-out/
          cp Platforms/Xiaomi/sweetPkg/PrebuiltUniXNU/inputs.json ../firmware-out/menu-inputs.json
          git submodule status > ../firmware-out/submodules.txt
          printf '%s\n' 'Experimental sweet UEFI + UniXNU menu only. No iOS16 kernel/payload. Not hardware verified; no phone flashing performed by CI.' > ../firmware-out/README.txt
          (cd ../firmware-out && sha256sum Mu-sweet.img SWEET_UEFI.fd > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-sweet-uefi
          path: firmware-out/
          if-no-files-found: warn
      - name: Collect firmware diagnostics
        if: failure()
        run: |
          mkdir -p firmware-diagnostics
          cp uefi-sweet/Build/BUILDLOG* firmware-diagnostics/ 2>/dev/null || true
          cp -R uefi-sweet/Build/sweetPkg/*/*.log firmware-diagnostics/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unixnu-sweet-uefi-diagnostics
          path: firmware-diagnostics/
          if-no-files-found: warn
